# Content for `SYSTEMD_EDITOR=nano systemctl edit caddy`
# (saved as /etc/systemd/system/caddy.service.d/override.conf).
# The empty ExecStart= clears the stock command, which runs with --environ
# and would print the token to the system log on every start.
[Service]
EnvironmentFile=/etc/caddy/caddy.env
ExecStart=
ExecStart=/usr/bin/caddy run --config /etc/caddy/Caddyfile
